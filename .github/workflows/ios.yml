name: iOS ビルド

# iOS のアプリが組み上がるところまで通す。android.yml の iOS 版。
#
# ci.yml は web 側までしか見ておらず、android.yml は Android しか組まない。
# cordova-ios や xcode（npm）の依存、プラグインの iOS 側が壊れても
# これが無いと誰も気づけない（package.json の overrides の uuid がその例）。
#
# 組むのはシミュレータ向けの debug ビルドだけ。署名が要らないので Secrets も使わない。
# 組んだものはシミュレータで起動し、落ちないことと画面を確かめる。
# 実機向け（iphoneos）は証明書とプロビジョニングプロファイルが要るので CI ではやらない。
#
# ランナーは GitHub ホストの macos-latest。public リポジトリなので無料。
# 自前ランナーを使わない理由は android.yml と同じ。

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: アプリを組む
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7 # zizmor: ignore[cache-poisoning]
        with:
          node-version-file: .nvmrc
          cache: npm

      # Xcode はランナーの既定を使う。cordova-ios 8 は 15.0 以上を要求する。
      # ランナーの更新で版が変わって落ちたときに追えるよう、版を残しておく
      - name: Xcode の版
        run: xcodebuild -version

      - name: Install
        run: npm ci

      # android.yml と違い release で作る。配る物に近い状態で起動を確かめるため。
      # debug だと probeGeolocation（app.js）が WebView の geolocation を呼び、
      # 「"localhost" would like to use your current location」が地図を覆う
      - name: web 側をビルド
        run: npm run copy

      # config.xml と package.json の cordova.plugins から復元する。
      # platforms/ios は .gitignore されているので毎回作り直し
      - name: iOS プラットフォームを用意
        run: npx cordova prepare ios

      # `cordova requirements ios` は使わない。ios-deploy（実機へ送る道具）と
      # CocoaPods も要求して落ちるが、どちらもシミュレータ向けのビルドには要らない
      # （CocoaPods を使うプラグインは入っていない）。
      #
      # --emulator で -sdk iphonesimulator / generic/platform=iOS Simulator になる。
      # シミュレータの起動はしない
      - name: アプリを組む
        run: npx cordova build ios --emulator --debug

      # www/ が空のまま組み上がっても xcodebuild は成功するので、中身まで見る
      - name: できたものを確認
        run: |
          set -euo pipefail
          app=$(find platforms/ios/build -path '*Debug-iphonesimulator*' -name '*.app' -maxdepth 3 | head -1)
          [ -n "$app" ] || { echo ".app が見つからない"; exit 1; }
          du -sh "$app"
          for f in www/index.html www/cordova.js www/js/all.js www/css/app.css; do
            [ -s "$app/$f" ] || { echo "$f が入っていない"; exit 1; }
          done
          echo "OK: $app"
          echo "APP_PATH=$app" >> "$GITHUB_ENV"

      # ここから起動スモークテスト。組めても起動しないものを拾う
      # （プラグインのネイティブ側の不整合、config.xml の設定ミスなど）。
      #
      # シミュレータには Bluetooth が無く iBeacon も扱えないので、
      # 測位はここでは一切検証できない。実機で確かめること。
      #
      # 端末はランナーに入っている中で最も新しい iOS の iPhone を使う。
      # 名前を決め打ちするとランナーの更新で消えて落ちる
      - name: シミュレータを起動
        run: |
          set -euo pipefail
          udid=$(xcrun simctl list devices available -j | jq -r '
            [.devices | to_entries[] | select(.key | test("SimRuntime\\.iOS-"))
             | .key as $rt | .value[] | select(.name | startswith("iPhone")) | {rt: $rt, udid}]
            | sort_by(.rt | capture("iOS-(?<ma>[0-9]+)-(?<mi>[0-9]+)") | [(.ma|tonumber), (.mi|tonumber)])
            | last | .udid')
          [ -n "$udid" ] && [ "$udid" != null ] || { echo "使える iPhone のシミュレータが無い"; exit 1; }
          xcrun simctl list devices | grep "$udid"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          echo "SIM_UDID=$udid" >> "$GITHUB_ENV"

      # 位置情報の許可ダイアログが地図を覆わないよう先に許可しておく。
      # シミュレータは Bluetooth LE 非対応（PeripheralManagerStateUnsupported）なので
      # Bluetooth のダイアログは出ない
      - name: アプリを入れて起動
        run: |
          set -euo pipefail
          xcrun simctl install "${SIM_UDID}" "${APP_PATH}"
          xcrun simctl privacy "${SIM_UDID}" grant location-always jp.calil.sabatomap
          out=$(xcrun simctl launch "${SIM_UDID}" jp.calil.sabatomap)
          echo "$out"
          echo "APP_PID=${out##*: }" >> "$GITHUB_ENV"

      # スプラッシュは地図を描き終えるか 8 秒で消える（app.js の hideSplash）。
      # 余裕を見て 20 秒待ってから、まだ生きているかを見る。
      #
      # 生きているだけでは JS が動いた証拠にならないので、app.js の
      # locationManager.setDelegate が iBeacon プラグインに届いたこともログで見る。
      # 「Registering delegate callback ID」はプラグインのネイティブ側が出す
      # （debugLogEnabled は既定で有効で、app.js は切っていない）。
      # ここまで来ていれば、バンドルの読み込み → deviceready → 初期化が通っている。
      #
      # 変数を ${} で囲んでいるのは、macOS の bash 3.2 が直後の全角文字の
      # バイトまで変数名として読むため
      - name: 起動直後に落ちていないか確認
        run: |
          set -euo pipefail
          sleep 20
          if ! ps -p "${APP_PID}" > /dev/null; then
            echo "::error::アプリが起動後 20 秒以内に終了した"
            exit 1
          fi
          echo "20 秒後も動いている（pid ${APP_PID}）"
          mkdir -p ios-smoke
          xcrun simctl spawn "${SIM_UDID}" log show --last 5m --style compact \
            --predicate 'process == "Sabatomap"' > ios-smoke/app-full.log
          if ! grep -q 'Registering delegate callback ID' ios-smoke/app-full.log; then
            echo "::error::JS からプラグインの呼び出しが届いていない（app.js の初期化が通っていない）"
            exit 1
          fi
          echo "JS からプラグインまで届いている"

      # console.* は cordova-ios が NSLog に流すので、JS 側の出力も app.log に出る。
      # 実 API とタイルへ通信するので、通信由来のエラーで落とすことはしない。
      #
      # プロセス全体のログは CoreLocation や WebKit の定型行で 3000 行を超えるので、
      # アプリ自身（cordova とプラグイン、JS の console）が出した行だけを app.log に抜く。
      # 全体は app-full.log に残す
      - name: 画面とログを取る
        if: always() && env.SIM_UDID != ''
        run: |
          set -uo pipefail
          mkdir -p ios-smoke
          xcrun simctl io "${SIM_UDID}" screenshot ios-smoke/screen.png
          xcrun simctl spawn "${SIM_UDID}" log show --last 5m --style compact \
            --predicate 'process == "Sabatomap"' > ios-smoke/app-full.log
          grep -E '\(Sabatomap(\.debug\.dylib)?\)' ios-smoke/app-full.log > ios-smoke/app.log || true
          cp -R ~/Library/Logs/DiagnosticReports ios-smoke/ 2>/dev/null || true
          echo "--- アプリのログ ---"
          cat ios-smoke/app.log

      - name: 画面とログを残す
        if: always() && env.SIM_UDID != ''
        uses: actions/upload-artifact@v7
        with:
          name: ios-smoke
          path: ios-smoke/
          retention-days: 14
