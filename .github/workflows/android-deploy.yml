name: Android テスト版の配信

# 署名済みの成果物を組んで Google Play へ上げる。
#
# android.yml は「組み上がるところまで」を見るだけで、成果物は署名なしの
# デバッグ APK。こちらは keystore で署名したものを作って配信する。
#
# ## 配信先が2つある
#
# internalsharing（内部アプリ共有）… 既定。**APK** を上げる。
#   ビルドごとにダウンロード URL が出る。
#   **versionCode が重複していても受け付ける**ので、master へ入るたびに
#   自動で上げられる。トラック（production / internal）には一切影響しない。
#   テスターは Play ストアアプリで「内部アプリ共有」を有効にしておく必要がある
#   （設定 → Play ストアのバージョンを7回タップ）。
#
#   **ダウンロードできないときは、まず受け取る側の Google アカウントを疑うこと。**
#   アップロード権限（サービスアカウント）とダウンロード権限（人のアカウント）は
#   完全に別物で、アップロードが成功していてもダウンロードは通らない。
#   2026-08-15 に、あるアカウントでは「ダウンロードできません」になり、
#   別のアカウントでは同じリンクが通る、という状態を実測している。
#   アップロードが成功したかは実行ログのダウンロード URL の有無で分かるので、
#   URL が出ているならビルドと配信の経路は正常で、原因はアカウント側にある。
#
#   ダウンロード側の設定は Play Console の
#   テストとリリース → 内部テスト → 内部アプリ共有 → メーリングリスト。
#   **内部テストトラックのテスターとは別のリスト。**
#   切り分けを急ぐなら同じ画面の「リンクを共有したユーザーはダウンロードできます」を
#   有効にする（1リンクあたり100人まで、リンクの有効期限は60日）。
#
#   どうしても通らないときは、下の「成果物を残す」が残す署名済み APK を
#   直接インストールすればよい。Play を経由しないので確実。
#
# internal（内部テスト）… 手動実行のときだけ選べる。Play 経由で配られ、更新も自動。
#   **versionCode が厳密に増加していないと弾かれる**ので、
#   config.xml の android-versionCode を先に上げること。
#   ここで上げた番号は production の下限にもなる（トラックをまたいで比較される）。
#
# ## 認証
#
# GitHub の OIDC トークンを Workload Identity Federation で交換する。
# **Play へ上げる鍵はリポジトリに置かない。**
#
# アップロード側のアクションは認証情報を自前で読まず、GOOGLE_APPLICATION_CREDENTIALS
# を立てて google-auth-library の ADC に任せている。そこへ WIF の認証情報ファイルの
# パスを渡している（serviceAccountJson は「パス」を受け取る入力）。
#
# ## 動かす前に要るもの
#
# Variables（秘密ではないので変数側）
#   GCP_WORKLOAD_IDENTITY_PROVIDER  google-github-actions/auth に渡す provider の完全名
#   GCP_PLAY_DEPLOYER_SA            なりすます先のサービスアカウント
#   ANDROID_KEY_ALIAS               keystore の鍵エイリアス
#
# Secrets
#   ANDROID_KEYSTORE_BASE64         署名用 keystore を base64 にしたもの
#   ANDROID_KEYSTORE_PASSWORD       keystore のパスワード（keyPassword も同じ）
#
# サービスアカウントは Play Console の「ユーザーと権限」へ招待し、アプリ単位で
# 「テスト版トラックとしてのアプリのリリース」を付ける。
# その中に「内部共有用の APK のアップロード」が含まれる。
#
# **secrets を使うので pull_request では絶対に走らせない。** このリポジトリは
# public で、同一リポジトリのブランチからの PR には secrets が渡る。

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      track:
        description: 配信先
        type: choice
        default: internalsharing
        options:
          - internalsharing
          - internal

permissions: {}

# 配信は追い越されると困るので、前の実行を打ち切らずに待たせる
concurrency:
  group: android-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Play へ上げる
    # フォークでは動かさない
    if: github.repository == 'CALIL/sabatomap'
    runs-on: ske-v2
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # 設定が足りない状態で走らせても、Gradle まで進んでから落ちて
      # 原因が分かりにくい。最初に見て、無ければここで止める
      - name: 設定の確認
        env:
          WIF_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          DEPLOYER_SA: ${{ vars.GCP_PLAY_DEPLOYER_SA }}
          KEY_ALIAS: ${{ vars.ANDROID_KEY_ALIAS }}
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          missing=""
          [ -n "$WIF_PROVIDER" ] || missing="$missing vars.GCP_WORKLOAD_IDENTITY_PROVIDER"
          [ -n "$DEPLOYER_SA" ] || missing="$missing vars.GCP_PLAY_DEPLOYER_SA"
          [ -n "$KEY_ALIAS" ] || missing="$missing vars.ANDROID_KEY_ALIAS"
          [ -n "$KEYSTORE" ] || missing="$missing secrets.ANDROID_KEYSTORE_BASE64"
          [ -n "$KEYSTORE_PASSWORD" ] || missing="$missing secrets.ANDROID_KEYSTORE_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::設定が足りない:$missing"
            echo "何を入れるかは .github/workflows/android-deploy.yml の先頭を読んでください"
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v7 # zizmor: ignore[cache-poisoning]
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: >-
            platform-tools
            platforms;android-36
            build-tools;36.0.0

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: '8.14.2'

      - name: Install
        run: npm ci

      - name: web 側をビルド
        run: npm run copy

      - name: Android プラットフォームを用意
        run: npx cordova prepare android

      # keystore とパスワードを置く。どちらも作業ディレクトリの外に出さない。
      # build-ci.json は .gitignore 済み。
      #
      # JSON は node で書く。ランナーの image は最小構成で jq が入っている保証がない。
      # node は setup-node 済みなので確実
      - name: 署名の準備
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ vars.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$KEYSTORE" | base64 -d > sabatomap-keystore.jks
          node -e '
            const fs = require("node:fs");
            const path = require("node:path");
            fs.writeFileSync("build-ci.json", JSON.stringify({
              android: { release: {
                keystore: path.resolve("sabatomap-keystore.jks"),
                storePassword: process.env.KEYSTORE_PASSWORD,
                alias: process.env.KEY_ALIAS,
                password: process.env.KEYSTORE_PASSWORD,
                keystoreType: "jks",
              } },
            }));
          '

      # internalsharing のときだけ versionCode を差し替える。
      #
      # config.xml の番号は本番と同じ（リリースのたびに手で上げるもの）。
      # 本番を入れている端末では**同じ番号のものを上書きできない**ので、
      # Play ストアが「3.0.8 をダウンロードできません」と言って止まる。
      #
      # 内部アプリ共有はトラックに属さず、番号の重複も許されるので、
      # ここで大きくしても production の下限には影響しない。
      #
      # 値は 2020-01-01 UTC からの分数。単調に増え、いまは7桁で、
      # Play の上限 2100000000 には千年単位で届かない。
      #
      # internal（内部テストトラック）のときは触らない。あちらは番号が
      # そのまま production の下限になるので、config.xml で意識して上げる
      - name: テスト版の versionCode を決める
        env:
          TRACK: ${{ github.event.inputs.track || 'internalsharing' }}
        run: |
          set -euo pipefail
          if [ "$TRACK" = "internalsharing" ]; then
            code=$(( ( $(date -u +%s) - 1577836800 ) / 60 ))
            echo "VERSION_CODE_ARG=--versionCode=$code" >> "$GITHUB_ENV"
            echo "VERSION_CODE=$code" >> "$GITHUB_ENV"
            echo "内部アプリ共有用に $code を使います"
          else
            echo "VERSION_CODE_ARG=" >> "$GITHUB_ENV"
            echo "config.xml の値をそのまま使います"
          fi

      # VERSION_CODE_ARG は前のステップが GITHUB_ENV へ入れたもの。
      # ${{ }} で展開せず、シェルの変数として渡す（テンプレート注入を避ける）
      # 内部アプリ共有には **APK** を上げる。internal トラックには AAB。
      #
      # Play は AAB を受け取ると、端末ごとの APK を生成して app signing key で
      # 署名し直す。内部アプリ共有ではこの工程が絡む必要が無く、
      # APK なら受け取ったものがそのまま配られる。
      # 実際に AAB では「ダウンロードできません」で配信できなかった。
      #
      # internal トラックは Play の通常の配信経路なので AAB が要る
      # （2021年8月以降、新規リリースは AAB のみ）
      #
      # **--packageType は両方に明示すること。** cordova-android は --release の
      # 既定が bundle で、省くと internalsharing でも AAB が焼かれる。
      # 次の「できたものを確認」が APK を探して落ちる（2026-08-15 に6回連続で失敗）
      - name: 成果物を組む
        env:
          TRACK: ${{ github.event.inputs.track || 'internalsharing' }}
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx3g -Dorg.gradle.daemon=false
        run: |
          set -euo pipefail
          if [ "$TRACK" = "internalsharing" ]; then
            npx cordova build android --release --buildConfig build-ci.json -- --packageType=apk ${VERSION_CODE_ARG:-}
          else
            npx cordova build android --release --buildConfig build-ci.json -- --packageType=bundle ${VERSION_CODE_ARG:-}
          fi

      - name: 鍵を消す
        if: always()
        run: rm -f sabatomap-keystore.jks build-ci.json

      # 成果物そのものを見る。
      #
      # 「--versionCode を渡したつもり」で終わらせない。AGP がマージした
      # マニフェストを読んで、狙った番号が実際に焼かれたかを確かめ、
      # 違えばここで止める。**上げてしまってからでは端末側でしか分からない。**
      - name: できたものを確認
        env:
          TRACK: ${{ github.event.inputs.track || 'internalsharing' }}
        run: |
          set -euo pipefail
          if [ "$TRACK" = "internalsharing" ]; then
            out=$(find platforms/android/app/build/outputs/apk -name '*-release.apk' | head -1)
          else
            out=$(find platforms/android/app/build/outputs/bundle -name '*.aab' | head -1)
          fi
          [ -n "$out" ] || { echo "::error::成果物が見つからない"; exit 1; }
          ls -lh "$out"
          echo "ARTIFACT_PATH=$out" >> "$GITHUB_ENV"

          manifest=$(find platforms/android/app/build/intermediates -name 'AndroidManifest.xml' -path '*erged*' | head -1)
          if [ -z "$manifest" ]; then
            echo "::error::マージ済みマニフェストが見つからない。versionCode を確認できない"
            exit 1
          fi
          built=$(grep -o 'android:versionCode="[0-9]*"' "$manifest" | grep -o '[0-9]*' | head -1)
          name=$(grep -o 'android:versionName="[^"]*"' "$manifest" | sed 's/.*="//;s/"//' | head -1)
          echo "焼かれた versionCode: $built  versionName: $name"

          if [ -n "${VERSION_CODE:-}" ] && [ "$built" != "$VERSION_CODE" ]; then
            echo "::error::versionCode が指定と違う（指定 $VERSION_CODE / 実際 $built）"
            exit 1
          fi
          echo "VERSION_CODE=$built" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$name" >> "$GITHUB_ENV"

      # OIDC で認証情報ファイルを作る。鍵は発行されず、数分で失効する
      - name: Google Cloud の認証
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_PLAY_DEPLOYER_SA }}

      # Play 側で配信が詰まったときに、ここから直接入れられるようにしておく。
      # 署名済みなのでストア版と同じ鍵で、そのままインストールできる
      - name: 成果物を残す
        uses: actions/upload-artifact@v7
        with:
          name: sabatomap-release
          path: ${{ env.ARTIFACT_PATH }}
          retention-days: 14

      - name: Play へ上げる
        id: upload
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          # 鍵ではなく WIF の認証情報ファイル。中身は検証されず、
          # GOOGLE_APPLICATION_CREDENTIALS に立てられるだけ
          serviceAccountJson: ${{ steps.auth.outputs.credentials_file_path }}
          packageName: jp.calil.sabatomap
          releaseFiles: ${{ env.ARTIFACT_PATH }}
          # push のときは常に internalsharing。手動実行だけ internal を選べる。
          # track（単数）は非推奨で、将来のアクション更新で消える
          tracks: ${{ github.event.inputs.track || 'internalsharing' }}
          status: completed

      - name: 結果をまとめに出す
        env:
          TRACK: ${{ github.event.inputs.track || 'internalsharing' }}
          URLS: ${{ steps.upload.outputs.internalSharingDownloadUrls }}
        run: |
          {
            echo "## Play へ上げました"
            echo ""
            echo "- 配信先: \`$TRACK\`"
            echo "- versionCode: \`$VERSION_CODE\`（**マージ済みマニフェストで確認済み**）"
            echo "- versionName: \`$VERSION_NAME\`（ストアの表示はこちら。テスト版でも本番と同じ）"
            echo "- コミット: \`${GITHUB_SHA:0:7}\`"
            if [ -n "$URLS" ]; then
              echo ""
              echo "### ダウンロード"
              echo ""
              echo "$URLS"
              echo ""
              echo "Play ストアアプリの設定で「内部アプリ共有」を有効にしてから開いてください。"
              echo ""
              echo "**ストア版が入っている端末では、このテスト版を入れると"
              echo "ストア版へ戻せなくなります**（versionCode が下がるため）。"
              echo "戻すときは一度アンインストールしてください。"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
