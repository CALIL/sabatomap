# Dependabot 設定
# https://docs.github.com/code-security/dependabot/working-with-dependabot/dependabot-options-reference
#
# 既存設定は open-pull-requests-limit: 0 でバージョン更新を止めていた。
# PR が乱立するのを避けるための措置だったが、minor/patch をグループ化すれば
# 本数は抑えられるため、上限を設けたうえで更新を再開する。
#
# 方針: minor/patch はグループ化して 1 PR にまとめ、major は個別 PR で判断する。
#       リリース直後の不具合や yank を踏まないよう cooldown で寝かせてから PR を出す。

version: 2

updates:
  # ---------------------------------------------------------------------------
  # npm
  # ---------------------------------------------------------------------------
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "javascript"
    commit-message:
      prefix: "chore(deps)"
    cooldown:
      default-days: 7
      semver-major-days: 30
    ignore:
      # Babel 8 にはまだ上げられない。ビルドが browserify + babelify で、
      # babelify の最新 10.0.0 が peer に @babel/core ^7.0.0 を要求する。
      # @babel/core だけ 8 にすると npm ci が ERESOLVE で落ちる（#129 で実測）。
      #
      # 移行にはこれらも要る。単なるバージョン更新では済まない。
      #   - babelify が Babel 8 に対応すること
      #   - @babel/polyfill をやめること（Babel 8 で削除。現状どこからも参照が無い）
      #   - @babel/plugin-proposal-class-properties をやめること
      #     （Babel 8 では preset-env に入っていて、この名前のパッケージは無い）
      #
      # 対応後にこの ignore を外してください。
      - dependency-name: "@babel/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "babelify"
        update-types: ["version-update:semver-major"]
      # react のメジャー更新は周辺ライブラリの対応状況をまとめて確認してから
      # 手動で判断する。詳細は Todoist を参照
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react-dom"
        update-types: ["version-update:semver-major"]
    groups:
      npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
