# Dependabot 設定
# https://docs.github.com/code-security/dependabot/working-with-dependabot/dependabot-options-reference
#
# 既存設定は open-pull-requests-limit: 0 でバージョン更新を止めていた。
# PR が乱立するのを避けるための措置だったが、minor/patch をグループ化すれば
# 本数は抑えられるため、上限を設けたうえで更新を再開する。
#
# 方針: minor/patch はグループ化して 1 PR にまとめ、major は個別 PR で判断する。
#       リリース直後の不具合や yank を踏まないよう cooldown で寝かせてから PR を出す。

version: 2

updates:
  # ---------------------------------------------------------------------------
  # npm
  # ---------------------------------------------------------------------------
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "javascript"
    commit-message:
      prefix: "chore(deps)"
    cooldown:
      default-days: 7
      semver-major-days: 30
    ignore:
      # Babel と babelify の ignore は 2026-08-15 に外した。
      # browserify + babelify + Babel を撤去して esbuild へ移したので、
      # 「babelify の peer が @babel/core ^7.0.0 固定で Babel 8 に上げられない」という
      # 前提そのものが無くなった。
      #
      # react のメジャー更新は周辺ライブラリの対応状況をまとめて確認してから
      # 手動で判断する。詳細は Todoist を参照
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
    groups:
      npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # ---------------------------------------------------------------------------
  # GitHub Actions (.github/workflows)
  # ---------------------------------------------------------------------------
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci(deps)"
    # github-actions では semver-major-days は使えない。
    # 指定すると設定ファイル全体が弾かれ、Dependabot がまったく動かなくなる。
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
