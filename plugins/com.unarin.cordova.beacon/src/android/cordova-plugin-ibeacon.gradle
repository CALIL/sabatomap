// jcenter は 2021-02 に読み取り専用化、2022 以降は配信も不安定なので使わない。
// cordova-android は templates/project/repositories.gradle で google() と
// mavenCentral() を宣言済みだが、このファイル単体でも解決できるよう明示する。
repositories {
    google()
    mavenCentral()
}

dependencies {
    implementation 'org.altbeacon:android-beacon-library:2.21.1'
}

android {
    packagingOptions {
        exclude 'META-INF/NOTICE'
        exclude 'META-INF/LICENSE'
    }
}
